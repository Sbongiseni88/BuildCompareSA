name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

# The standalone Python FastAPI backend (and its CI job) was removed in the
# tender-pivot refactor. The only surviving Python service is scraper/, which
# is exercised manually — it drives real headless browsers and has no CI gate.
jobs:
  frontend:
    name: Frontend (Next.js)
    timeout-minutes: 15
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./buildcompare-sa

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./buildcompare-sa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Linting
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Jest Tests
        run: npm test
