<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildCompare SA — Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 400px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: #facc15;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 0 40px rgba(250, 204, 21, 0.3);
        }

        .logo img {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        h1 span {
            color: #facc15;
        }

        p {
            color: #94a3b8;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .retry-btn {
            background: linear-gradient(135deg, #facc15, #eab308);
            color: #0f172a;
            font-weight: 700;
            padding: 12px 32px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(250, 204, 21, 0.4);
        }

        .tip {
            margin-top: 2rem;
            padding: 1rem;
            border: 1px solid rgba(250, 204, 21, 0.2);
            border-radius: 12px;
            background: rgba(250, 204, 21, 0.05);
        }

        .tip p {
            color: #cbd5e1;
            margin: 0;
            font-size: 0.85rem;
        }

        .tip strong {
            color: #facc15;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">⚡</div>
        <div class="logo">
            <img src="/images/logo.png" alt="BuildCompare Logo" />
        </div>
        <h1>BUILD<span>COMPARE</span> SA</h1>
        <p>You're currently offline. This could be loadshedding or a connection issue. Your previous searches are still
            cached!</p>

        <button class="retry-btn" onclick="window.location.reload()">
            Try Again
        </button>

        <div class="tip">
            <p>💡 <strong>Pro Tip:</strong> Your last price searches are saved locally. They'll be available again once
                you reconnect.</p>
        </div>
    </div>
</body>

</html>
